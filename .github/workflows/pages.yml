name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/focused-bohr-b2yhti]
  workflow_dispatch:
  # Раз в 3 часа подтягиваем свежие релизы и анонсы с Яндекс Музыки
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe sources
        run: node scripts/yandex-probe.mjs
      - name: Sync Yandex Music
        run: node scripts/yandex-sync.mjs
        env:
          YANDEX_DEBUG: '1'
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
